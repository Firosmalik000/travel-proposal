function getHotelCost(hid, bid, pid, rooms, malam, hotels, r) {
  try {
    const h = (hotels || []).find(x => x && x.id === hid) || {};
    const b = (h.brokers || []).find(x => x && x.id === bid) || {};
    const p = (b.periods || []).find(x => x && x.id === pid) || (b.periods || []).find(x => x) || {};
    const cv = (a, c) => cvt(a, c, r);
    const cost = ((rooms.quad || 0) * cv(p.quad || 0, p.currency || "SAR") + (rooms.triple || 0) * cv(p.triple || 0, p.currency || "SAR") + (rooms.double || 0) * cv(p.double || 0, p.currency || "SAR")) * (malam || 0);
    const cap = (rooms.quad || 0) * 4 + (rooms.triple || 0) * 3 + (rooms.double || 0) * 2;
    return {
      cost,
      cap
    };
  } catch (e) {
    return {
      cost: 0,
      cap: 0
    };
  }
}
/* Hotel cost yang mendukung mode "Isi Manual" (pk[prefix+"ManualMode"]=true) selain lookup dari master data hotel. */
function getHotelCostAny(pk, prefix, rooms, malam, hotels, r) {
  if (pk[prefix + "ManualMode"]) {
    try {
      const cv = (a, c) => cvt(a, c, r);
      const curr = pk[prefix + "ManualCurrency"] || "SAR";
      const cost = ((rooms.quad || 0) * cv(pk[prefix + "ManualQuad"] || 0, curr) + (rooms.triple || 0) * cv(pk[prefix + "ManualTriple"] || 0, curr) + (rooms.double || 0) * cv(pk[prefix + "ManualDouble"] || 0, curr)) * (malam || 0);
      const cap = (rooms.quad || 0) * 4 + (rooms.triple || 0) * 3 + (rooms.double || 0) * 2;
      return { cost, cap };
    } catch (e) {
      return { cost: 0, cap: 0 };
    }
  }
  return getHotelCost(pk[prefix + "Id"], pk[prefix + "BrokerId"], pk[prefix + "PeriodId"], rooms, malam, hotels, r);
}
function getVisaData(bid, pax, auto, data, r) {
  try {
    const cv = (a, c) => cvt(a, c, r);
    let broker = null;
    if (auto) {
      let best = Infinity;
      (data.visaBrokers || []).filter(vb => vb && vb.id).forEach(vb => {
        const tier = (vb.tiers || []).find(t => t.minPax <= pax && t.maxPax >= pax);
        if (tier) {
          const p = cv(tier.harga || 0, vb.currency || "USD");
          if (p < best) {

    const tier = (broker.tiers || []).find(t => t && t.minPax <= pax && t.maxPax >= pax) || (broker.tiers || []).find(t => t) || {};
    const perPax = cv(tier.harga || 0, broker.currency || "USD");

    return {
      perPax: 0,

/* ── UPLOAD MASTER DATA HOTEL (CSV) ──
   Format kolom (baris pertama harus header persis ini):
   hotel,kota,bintang,broker,periode,dari,sampai,quad,triple,double
   - "hotel" dicocokkan by nama (case-insensitive). Kalau hotel belum ada -> dibuat baru.
   - "broker" dicocokkan by nama dalam hotel itu. Kalau belum ada -> broker baru ditambahkan.
   - Tiap baris CSV = 1 periode harga. Baris dgn hotel+broker sama akan numpuk jadi banyak periode.
   - dari/sampai format: YYYY-MM-DD. quad/triple/double: angka SAR, isi 0 kalau tidak ada tipe itu.
*/
function parseHotelUploadCSV(text) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return [];
  let start = 0;
  if (lines[0].toLowerCase().replace(/\s/g, "").startsWith("hotel,kota")) start = 1;
  const rows = [];
  for (let i = start; i < lines.length; i++) {
    const c = lines[i].split(",").map(x => x.trim());
    if (c.length < 10) continue;
    rows.push({
      hotel: c[0], kota: c[1], bintang: c[2], broker: c[3], periode: c[4],
      dari: c[5], sampai: c[6], quad: c[7], triple: c[8], double: c[9]
    });
  }
  return rows;
}
function mergeHotelUpload(existingHotels, rows) {
  const hotels = (existingHotels || []).map(h => ({
    ...h,
    brokers: (h.brokers || []).map(b => ({ ...b, periods: [...(b.periods || [])] }))
  }));
  let addedHotels = 0, addedBrokers = 0, addedPeriods = 0;
  const touched = [];
  rows.forEach(r => {
    if (!r.hotel || !r.dari || !r.sampai) return;
    let h = hotels.find(x => x.nama && x.nama.trim().toLowerCase() === r.hotel.trim().toLowerCase());
    if (!h) {
      h = { id: nid(hotels), nama: r.hotel.trim(), negara: "Arab Saudi", kota: r.kota || "Makkah", bintang: Number(r.bintang) || 3, brokers: [] };
      hotels.push(h);
      addedHotels++;
    }
    let b = (h.brokers || []).find(x => x.nama && x.nama.trim().toLowerCase() === (r.broker || "").trim().toLowerCase());
    if (!b) {
      b = { id: Math.max(0, ...(h.brokers || []).map(x => x.id)) + 1, nama: (r.broker || "Upload " + new Date().toISOString().slice(0, 10)).trim(), periods: [] };
      h.brokers.push(b);
      addedBrokers++;
    }
    b.periods.push({
      id: b.periods.length + 1,
      nama: r.periode || (r.dari + " s/d " + r.sampai),
      dari: r.dari, sampai: r.sampai,
      quad: Number(r.quad) || 0, triple: Number(r.triple) || 0, double: Number(r.double) || 0,
      currency: "SAR"
    });
    addedPeriods++;
    touched.push(h.nama);
  });
  return { hotels, summary: { addedHotels, addedBrokers, addedPeriods, touched: [...new Set(touched)] } };
}
